services:

  wordpress:
    image: wordpress:latest
    container_name: villa-wordpress
    ports:
      - "8881:80"

    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_PUBLIC_URL: ${WORDPRESS_PUBLIC_URL:-http://localhost:8881}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', getenv('WORDPRESS_PUBLIC_URL'));
        define('WP_SITEURL', getenv('WORDPRESS_PUBLIC_URL'));

    volumes:
      - ./wordpress:/var/www/html

    depends_on:
      - mysql


  mysql:
    image: mysql:8.0
    container_name: villa-mysql

    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root

    volumes:
      - ./mysql:/var/lib/mysql
